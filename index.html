<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="一個用來記住朋友的興趣、近況與相處片段的私人關係手帳。"
    />
    <title>Inner Circle — 朋友手帳</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="tube.css" />
    <link rel="stylesheet" href="carousel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Inner Circle 首頁">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>inner circle.</span>
        </a>
        <div class="header-actions">
          <button class="primary-button" id="openAddFriend" type="button" aria-label="新增朋友">
            <span>＋</span> 新朋友
          </button>
        </div>
      </header>

      <main id="top">
        <section class="content-section" id="friends" aria-labelledby="friends-title">
          <h1 class="sr-only" id="friends-title">朋友</h1>

          <div class="workspace">
            <div class="friends-area">
              <div class="result-bar">
                <p>點選朋友，看看近況</p>
                <div class="collection-controls">
                <div class="tube-controls" id="tubeControls" role="group" aria-label="環繞相簿控制">
                  <button type="button" id="tubePrevious" aria-label="向左轉動相簿">←</button>
                  <button type="button" id="tubePause" aria-pressed="false" aria-label="暫停自動旋轉"><span id="tubePauseIcon" aria-hidden="true">Ⅱ</span><span class="sr-only" id="tubePauseLabel">暫停</span></button>
                  <button type="button" id="tubeNext" aria-label="向右轉動相簿">→</button>
                </div>
                <div class="board-actions" id="stampActions" aria-label="整理朋友郵票" hidden>
                  <button id="organiseStamps" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx=".5"/><rect x="12" y="3" width="5" height="5" rx=".5"/><rect x="3" y="12" width="5" height="5" rx=".5"/><rect x="12" y="12" width="5" height="5" rx=".5"/></svg>Organise</button>
                  <button id="shuffleStamps" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h2c4 0 6 10 10 10h2m-3-3 3 3-3 3M3 15h2c1.5 0 2.7-1.4 4-3.2M11 8.2C12.3 6.4 13.5 5 15 5h2m-3-3 3 3-3 3"/></svg>Shuffle</button>
                </div>
                <div class="ring-controls" id="ringControls" role="group" aria-label="橫向轉盤控制" hidden>
                  <button type="button" id="ringPrevious" aria-label="上一位朋友">←</button>
                  <button type="button" id="ringNext" aria-label="下一位朋友">→</button>
                </div>
                <div class="collection-views" role="group" aria-label="檢視方式">
                  <button type="button" id="tubeView" class="active" aria-pressed="true" aria-controls="tubeGallery">Tube</button>
                  <button type="button" id="ringView" aria-pressed="false" aria-controls="carouselMode">Ring</button>
                  <button type="button" id="stampsView" aria-pressed="false" aria-controls="stampBoard">Stamps</button>
                </div>
                </div>
              </div>
              <div id="carouselMode" role="region" aria-label="朋友橫向轉盤" aria-describedby="ringHelp" hidden></div>
              <p class="sr-only" id="ringHelp">左右拖曳、捲動或使用方向鍵轉動。點選側邊朋友移到中央，再點選中央朋友開啟手帳。</p>
              <div class="tube-gallery" id="tubeGallery" hidden>
                <div class="tube-stage" id="tubeStage" role="region" aria-label="朋友環繞相簿" aria-describedby="tubeHelp">
                  <div class="tube-orbit tube-orbit-top" aria-hidden="true"></div>
                  <div class="tube-orbit tube-orbit-bottom" aria-hidden="true"></div>
                  <div class="tube-world" id="tubeWorld"></div>
                </div>
                <p class="sr-only" id="tubeHelp">左右拖曳或使用方向按鈕轉動。以 Tab 選取朋友，Enter 開啟手帳。可暫停自動旋轉。</p>
              </div>
              <div class="stamp-board" id="stampBoard" aria-label="朋友郵票收藏" aria-describedby="boardHelp" hidden>
                <div class="friends-grid" id="friendsGrid"></div>
                <div class="focus-bubble" id="stampFocusBubble" hidden role="note" aria-label="依手帳想像的語氣，非本人原話">
                  <p class="focus-bubble-text"></p>
                  <span class="focus-bubble-caption">依手帳想像的語氣 · 非本人原話</span>
                </div>
                <div class="stamp-focus-controls" id="stampFocusControls" hidden role="group" aria-label="專注模式">
                  <button class="focus-profile" id="openFocusedFriend" type="button">打開朋友手帳 <span aria-hidden="true">↗</span></button>
                  <button class="focus-close" id="closeStampFocus" type="button" aria-label="退出專注模式">返回收藏 <kbd>esc</kbd></button>
                </div>
              </div>
              <p class="sr-only" id="boardHelp">拖曳可移動郵票，點選可進入專注模式。以 Tab 選取朋友，方向鍵移動，Enter 進入專注模式，Escape 返回。</p>
              <p class="sr-only" id="boardStatus" role="status" aria-live="polite"></p>
              <div class="empty-state" id="emptyState" hidden>
                <h3>還沒有朋友</h3>
                <button class="secondary-button" id="emptyAddFriend" type="button">新增朋友</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="friend-drawer" id="friendDrawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="朋友詳情" inert>
      <button class="drawer-close icon-button" id="closeDrawer" type="button" aria-label="關閉朋友詳情">×</button>
      <div id="drawerContent"></div>
    </aside>

    <dialog class="app-dialog" id="friendDialog">
      <form id="friendForm">
        <div class="dialog-header">
          <div>
            <h2>新增朋友</h2>
          </div>
          <button class="icon-button dialog-close" type="button" data-close-dialog="friendDialog" aria-label="關閉">×</button>
        </div>
        <div class="form-grid">
          <label><span>名字 *</span><input name="name" required placeholder="例如：林小雨" /></label>
          <label><span>暱稱</span><input name="nickname" placeholder="你怎麼稱呼他？" /></label>
          <label><span>生日</span><input name="birthday" type="date" /></label>
        </div>
        <div class="dialog-actions">
          <button class="text-button" type="button" data-close-dialog="friendDialog">取消</button>
          <button class="primary-button" type="submit">新增朋友</button>
        </div>
      </form>
    </dialog>

    <dialog class="app-dialog interaction-dialog" id="sourceDialog">
      <form id="sourceForm">
        <input type="hidden" name="friendId" />
        <input type="hidden" name="sourceId" />
        <div class="dialog-header">
          <div>
            <p class="eyebrow" id="sourceEyebrow">EDIT SOURCE</p>
            <h2 id="sourceTitle">編輯原始記錄</h2>
            <p class="dialog-subtitle" id="sourceDialogSub"></p>
          </div>
          <button class="icon-button dialog-close" type="button" data-close-dialog="sourceDialog" aria-label="關閉">×</button>
        </div>
        <div class="form-grid">
          <label><span>日期</span><input name="date" placeholder="例如：2026.08.25 或 ARCHIVE" /></label>
          <label><span>標題</span><input name="label" placeholder="這則記錄的標題" /></label>
          <label class="full"><span>原文 *</span><textarea name="text" rows="14" required placeholder="原始筆記的內容…"></textarea></label>
        </div>
        <div class="dialog-actions">
          <button class="text-button" type="button" data-close-dialog="sourceDialog">取消</button>
          <button class="primary-button" type="submit">儲存原文</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
